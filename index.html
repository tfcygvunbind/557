<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哥斯拉 Pro - Lua混淆工具 | 纯字符串加密</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: "Consolas", "微软雅黑", sans-serif;}
        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 69, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 69, 0, 0.05) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 16px;
            padding: 35px;
            border: 2px solid #ff4500;
            box-shadow: 
                0 0 40px rgba(255, 69, 0, 0.3),
                inset 0 0 20px rgba(255, 69, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        .godzilla-title {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            color: #ff4500;
            text-shadow: 
                0 0 10px #ff4500,
                0 0 20px #ff4500,
                0 0 40px rgba(255, 69, 0, 0.5);
            margin-bottom: 10px;
            letter-spacing: 1px;
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .godzilla-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff4500, transparent);
        }
        .godzilla-sub {
            text-align: center;
            color: #ccc;
            margin-bottom: 35px;
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.6;
        }
        .code-box {
            margin-bottom: 30px;
            transition: transform 0.3s;
        }
        .code-box:hover {
            transform: translateY(-2px);
        }
        .code-box h3 {
            color: #ff4500;
            margin-bottom: 15px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .code-box h3::before {
            content: "🦖🦖🦖";
            font-size: 22px;
            filter: drop-shadow(0 0 5px #ff4500);
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 20px;
            background: rgba(10, 10, 10, 0.8);
            border: 2px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;

            outline: none;
            transition: all 0.3s;

            word-wrap: normal;
            overflow-x: auto;

        }
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #222;

        textarea::-webkit-scrollbar-thumb {

            background: rgba(15, 15, 15, 0.9);

        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

        .control-group {
            padding: 15px;
            background: rgba(30, 30, 30, 0.7);
            border-radius: 10px;
            border: 1px solid #444;
            transition: all 0.3s;
        }
        .control-group:hover {
            border-color: #ff4500;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 69, 0, 0.2);
        }
        .control-group label {
            display: block;
            margin-bottom: 12px;
            color: #ff4500;
            font-size: 14px;
            font-weight: bold;
        }
        select, input[type="range"] {
            width: 100%;
            padding: 10px 15px;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #555;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        select:focus, input[type="range"]:focus {
            border-color: #ff4500;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.3);
        }
        input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
            background: linear-gradient(90deg, #333, #ff4500);
            border-radius: 4px;
            padding: 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #ff4500;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.8);
            transition: all 0.3s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(255, 69, 0, 1);
        }
        .range-value {
            display: inline-block;
            margin-left: 10px;
            color: #ff4500;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .btn {
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            min-width: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn:hover::before {
            width: 300px;
            height: 300px;
        }
        .btn-obf {
            background: linear-gradient(135deg, #ff4500, #ff6b35);
            color: #000;

        .btn-obf:hover {

        }
        .btn-clear, .btn-copy {
            background: linear-gradient(135deg, #333, #444);
            color: #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .btn-clear:hover, .btn-copy:hover {
            background: linear-gradient(135deg, #444, #555);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 69, 0, 0.3);
        }
        .btn:active {
            transform: translateY(-1px);
        }
        .tip {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .tip span {
            color: #ff4500;
            font-weight: bold;
            padding: 5px 10px;
            background: rgba(255, 69, 0, 0.1);
            border-radius: 5px;
        }
        .stats {
            text-align: center;
            color: #888;
            font-size: 14px;
            padding: 15px;
            background: rgba(30, 30, 30, 0.6);
            border-radius: 10px;
            border: 1px solid #444;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .stats.active {
            color: #ff4500;
            border-color: #ff4500;
            background: rgba(255, 69, 0, 0.1);
        }
        .feature-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }
        .feature-item {
            background: rgba(255, 69, 0, 0.05);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #ff4500;
            font-size: 13px;
            color: #ccc;
        }
        .feature-item strong {
            color: #ff4500;
            display: block;
            margin-bottom: 5px;
        }
        
        .preset-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .preset-btn {
            padding: 8px 15px;
            background: rgba(255, 69, 0, 0.2);
            border: 1px solid #ff4500;
            border-radius: 6px;
            color: #ffa500;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .preset-btn:hover {
            background: rgba(255, 69, 0, 0.4);
            transform: translateY(-2px);
        }
        .preset-btn.active {
            background: #ff4500;
            color: #000;
            font-weight: bold;
        }
        .progress-container {
            height: 4px;
            background: rgba(255, 69, 0, 0.2);
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff4500, #ff8c00);
            width: 0%;
            transition: width 0.3s;
        }
        .history-section {
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
        .history-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .history-item {
            padding: 8px 12px;
            background: rgba(255, 69, 0, 0.05);
            border-radius: 6px;
            margin-bottom: 5px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        .history-item:hover {
            background: rgba(255, 69, 0, 0.1);
        }
        .code-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: rgba(255, 69, 0, 0.9);
            color: #fff;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.3s;
        }
        .notification.show {
            transform: translateX(0);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .godzilla-title {
                font-size: 32px;
            }
            .controls {
                grid-template-columns: 1fr;
            }
            .btn {
                min-width: 140px;
                padding: 12px 25px;
            }
            .preset-buttons {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="godzilla-title">哥斯拉 Pro - Lua混淆工具</h1>
        <p class="godzilla-sub">纯字符串十六进制加密 | 保持代码结构不变</p>
        
        <div class="code-box">
            <h3>原始Lua脚本（粘贴即可）</h3>
            <textarea id="originalCode" placeholder="粘贴你的loadstring脚本..."></textarea>
            <div class="code-info">
                <span id="charCount">0 字符</span>
                <span id="lineCount">0 行</span>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>字符串加密方式</label>
                <select id="stringEncrypt">
                    <option value="hex" selected>十六进制编码 (推荐)</option>
                    <option value="base64">Base64编码</option>
                    <option value="unicode">Unicode编码</option>
                </select>
            </div>
        </div>

        <div class="feature-list">
            <div class="feature-item"><strong>✅ 简洁高效</strong>只转换字符串，保持代码结构</div>
            <div class="feature-item"><strong>🔒 纯本地处理</strong>脚本永不上传服务器</div>
            <div class="feature-item"><strong>🚀 即时处理</strong>实时转换，无需等待</div>
            <div class="feature-item"><strong>🎯 兼容性强</strong>完美适配loadstring</div>
        </div>

        <div class="code-box">
            <h3>混淆后Lua脚本</h3>
            <textarea id="obfCode" placeholder="混淆后的代码将显示在这里..." readonly></textarea>
            <div class="code-info">
                <span id="obfCharCount">0 字符</span>
                <span id="obfLineCount">0 行</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-obf" onclick="obfuscateLua()" id="obfuscateBtn">
                <span>🦖🦖🦖</span> 一键混淆
            </button>
            <button class="btn btn-clear" onclick="clearAll()">
                <span>🗑🗑️</span> 清空内容
            </button>
            <button class="btn btn-copy" onclick="copyObfCode()">
                <span>📋📋</span> 复制代码
            </button>
        </div>

        <!-- 历史记录 -->
        <div class="history-section">
            <h3>历史记录 <span id="historyCount">(0)</span></h3>
            <div class="history-list" id="historyList">
                <!-- 历史记录将动态添加 -->
            </div>
        </div>

        <p class="tip">
            <span>✅ 只加密字符串</span>
            <span>🚫 无额外代码</span>
            <span>🎯 保持原结构</span>
            <span>⚡ 实时处理</span>
        </p>
        <div class="stats" id="statsInfo">等待混淆...</div>
    </div>

    <!-- 通知 -->
    <div class="notification" id="notification"></div>

    <script>
        // 精简版混淆工具 - 只处理字符串加密
        class SimpleObfuscator {
            constructor() {
                this.cache = new Map();
            }

            // 十六进制编码
            hexEncode(str) {
                let hex = '';
                for (let i = 0; i < str.length; i++) {
                    hex += '\\x' + str.charCodeAt(i).toString(16).padStart(2, '0');
                }
                return hex;
            }

            // Base64编码
            base64Encode(str) {
                const base64 = btoa(unescape(encodeURIComponent(str)));
                return `(loadstring and loadstring or load)((function()
    local b='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
    local data='${base64}'
    return (data:gsub('.', function(x)
        if (x == '=') then return '' end
        local r,f='',(b:find(x)-1)
        for i=6,1,-1 do r=r..(f%2^i-f%2^(i-1)>0 and '1' or '0') end
        return r;
    end):gsub('%d%d%d?%d?%d?%d?%d?%d?', function(x)
        if (#x ~= 8) then return '' end
        local c=0
        for i=1,8 do c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0) end
        return string.char(c)
    end))
end)())`;
            }

            // Unicode编码
            unicodeEncode(str) {
                let unicode = '';
                for (let i = 0; i < str.length; i++) {
                    const code = str.charCodeAt(i);
                    if (code < 128) {
                        unicode += String.fromCharCode(code);
                    } else {
                        unicode += '\\u' + code.toString(16).padStart(4, '0');
                    }
                }
                return `"${unicode}"`;
            }

            // 提取代码中的字符串并加密
            async obfuscate(code, progressCallback = null) {
                const startTime = performance.now();
                const method = document.getElementById('stringEncrypt').value;
                
                let result = code;
                
                // 查找所有引号内的字符串（单引号和双引号）
                const stringRegex = /(['"])(.*?)\1/g;
                const matches = [];
                let match;
                
                while ((match = stringRegex.exec(code)) !== null) {
                    matches.push({
                        fullMatch: match[0],
                        quote: match[1],
                        content: match[2],
                        index: match.index
                    });
                }
                
                // 从后往前替换，避免索引变化
                for (let i = matches.length - 1; i >= 0; i--) {
                    const match = matches[i];
                    let encryptedContent;
                    
                    switch(method) {
                        case 'hex':
                            encryptedContent = this.hexEncode(match.content);
                            result = result.substring(0, match.index) + 
                                     match.quote + encryptedContent + match.quote + 
                                     result.substring(match.index + match.fullMatch.length);
                            break;
                            
                        case 'base64':
                            // Base64编码需要特殊处理
                            result = this.base64Encode(match.content);
                            break;
                            
                        case 'unicode':
                            encryptedContent = this.unicodeEncode(match.content);
                            result = result.substring(0, match.index) + 
                                     encryptedContent + 
                                     result.substring(match.index + match.fullMatch.length);
                            break;
                    }
                    
                    if (progressCallback) {
                        progressCallback((matches.length - i) / matches.length * 100);
                    }
                }
                
                // 如果只有单个字符串且是Base64编码，直接返回
                if (method === 'base64' && matches.length === 1 && matches[0].fullMatch === code.trim()) {
                    result = this.base64Encode(matches[0].content);
                }
                
                const endTime = performance.now();
                const timeTaken = (endTime - startTime).toFixed(2);
                
                return {
                    code: result,
                    time: timeTaken,
                    length: result.length,
                    originalLength: code.length
                };
            }
        }

        // UI相关函数
        const obfuscator = new SimpleObfuscator();
        let obfuscationHistory = [];

        function showNotification(message, duration = 3000) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, duration);
        }

        function updateCodeStats() {
            const originalCode = document.getElementById('originalCode').value;
            const obfCode = document.getElementById('obfCode').value;
            
            document.getElementById('charCount').textContent = `${originalCode.length} 字符`;
            document.getElementById('lineCount').textContent = `${originalCode.split('\n').length} 行`;
            
            document.getElementById('obfCharCount').textContent = `${obfCode.length} 字符`;
            document.getElementById('obfLineCount').textContent = `${obfCode.split('\n').length} 行`;
        }

        function addToHistory(result) {
            const historyItem = {
                timestamp: new Date().toLocaleString(),
                originalLength: result.originalLength,
                obfuscatedLength: result.length,
                time: result.time
            };
            
            obfuscationHistory.unshift(historyItem);
            if (obfuscationHistory.length > 10) {
                obfuscationHistory = obfuscationHistory.slice(0, 10);
            }
            
            updateHistoryDisplay();
            saveHistory();
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('historyList');
            const historyCount = document.getElementById('historyCount');
            
            historyList.innerHTML = '';
            historyCount.textContent = `(${obfuscationHistory.length})`;
            
            obfuscationHistory.forEach((item, index) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <span>${item.timestamp}</span>
                    <span>${item.originalLength} → ${item.obfuscatedLength} 字符</span>
                `;
                historyItem.onclick = () => {
                    document.getElementById('statsInfo').textContent = 
                        `历史记录 ${index+1}: ${item.timestamp} | 耗时 ${item.time}ms`;
                    document.getElementById('statsInfo').classList.add('active');
                };
                historyList.appendChild(historyItem);
            });
        }

        function saveHistory() {
            localStorage.setItem('godzillaHistory', JSON.stringify(obfuscationHistory));
        }

        function loadHistory() {
            const savedHistory = localStorage.getItem('godzillaHistory');
            if (savedHistory) {
                obfuscationHistory = JSON.parse(savedHistory);
                updateHistoryDisplay();
            }
        }

        async function obfuscateLua() {
            let code = document.getElementById("originalCode").value.trim();
            if (!code) {
                showNotification("请粘贴需要混淆的Lua脚本！", 3000);
                return;
            }

            try {
                const statsDiv = document.getElementById("statsInfo");
                const obfuscateBtn = document.getElementById("obfuscateBtn");
                const progressContainer = document.getElementById("progressContainer");
                const progressBar = document.getElementById("progressBar");
                
                statsDiv.textContent = "正在混淆中...";
                statsDiv.classList.remove('active');
                obfuscateBtn.disabled = true;
                obfuscateBtn.textContent = "混淆中...";
                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                
                const progressCallback = (progress) => {
                    progressBar.style.width = `${progress}%`;
                };
                
                const result = await obfuscator.obfuscate(code, progressCallback);
                
                document.getElementById("obfCode").value = result.code;
                progressBar.style.width = '100%';
                
                statsDiv.textContent = 
                    `✅ 混淆完成！耗时 ${result.time}ms | ` +
                    `原始长度：${result.originalLength} 字符 | ` +
                    `混淆后：${result.length} 字符`;
                statsDiv.classList.add('active');
                
                addToHistory(result);
                updateCodeStats();
                
                setTimeout(() => {
                    obfuscateBtn.disabled = false;
                    obfuscateBtn.innerHTML = '<span>🦖🦖🦖</span> 一键混淆';
                    progressContainer.style.display = 'none';
                    
                    document.getElementById("obfCode").scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 500);
                
            } catch (error) {
                console.error("混淆错误:", error);
                showNotification(`混淆失败：${error.message}`, 5000);
                document.getElementById("statsInfo").textContent = "❌❌ 混淆失败，请检查输入";
                document.getElementById("statsInfo").classList.remove('active');
                
                document.getElementById("obfuscateBtn").disabled = false;
                document.getElementById("obfuscateBtn").innerHTML = '<span>🦖🦖🦖</span> 一键混淆';
                document.getElementById("progressContainer").style.display = 'none';
            }
        }

        function clearAll() {
            if (confirm("确定要清空所有内容吗？")) {
                document.getElementById("originalCode").value = "";
                document.getElementById("obfCode").value = "";
                document.getElementById("statsInfo").textContent = "等待混淆...";
                document.getElementById("statsInfo").classList.remove('active');
                document.getElementById("originalCode").focus();
                updateCodeStats();
            }
        }

        function copyObfCode() {
            const obfCode = document.getElementById("obfCode");
            if (!obfCode.value.trim()) {
                showNotification("暂无混淆后的代码可复制！", 3000);
                return;
            }
            
            obfCode.select();
            obfCode.setSelectionRange(0, 99999);
            
            try {
                const successful = document.execCommand("copy");
                if (successful) {
                    showNotification("✅ 代码已复制到剪贴板！", 2000);
                } else {
                    showNotification("复制失败，请手动选择并复制", 3000);
                }
            } catch (err) {
                console.error("复制失败:", err);
                showNotification("复制失败，请手动复制", 3000);
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                obfuscateLua();
                e.preventDefault();
            }
            if (e.ctrlKey && e.key === 'c') {
                if (document.activeElement === document.getElementById("obfCode")) {
                    copyObfCode();
                    e.preventDefault();
                }
            }
            if (e.key === 'Escape') {
                clearAll();
            }
        });

        document.getElementById('originalCode').addEventListener('input', updateCodeStats);
        document.getElementById('obfCode').addEventListener('input', updateCodeStats);

        window.addEventListener('load', function() {
            const exampleCode = `loadstring(game:HttpGet("https://api.jnkie.com/api/v1/luascripts/public/c7d693ddb2834cdbe37ab59f1fa033def4d8264cc521b88c31a74ece4a8c5487/download"))()`;
            document.getElementById("originalCode").placeholder = exampleCode;
            updateCodeStats();
            loadHistory();
            
            // 添加示例代码按钮
            const exampleBtn = document.createElement('button');
            exampleBtn.className = 'btn';
            exampleBtn.style.background = 'linear-gradient(135deg, #00cc66, #00ff99)';
            exampleBtn.style.marginLeft = '10px';
            exampleBtn.innerHTML = '<span>📝</span> 加载示例';
            exampleBtn.onclick = function() {
                document.getElementById("originalCode").value = exampleCode;
                updateCodeStats();
                showNotification("已加载示例代码", 2000);
            };
            document.querySelector('.btn-group').appendChild(exampleBtn);
        });
    </script>
</body>
</html>
