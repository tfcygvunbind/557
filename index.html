<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>手机混淆器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-text-size-adjust:none}
body{background:#000;color:#0f0;font-family:Consolas,monospace;padding:12px;}
textarea{
width:100%;height:260px;background:#111;border:1px solid #333;
color:#0f0;padding:10px;border-radius:6px;
font-size:14px;resize:none;margin-bottom:10px;
}
button{
width:100%;padding:14px 0;margin:6px 0;
background:#0066ff;color:#fff;
border:none;border-radius:6px;font-size:16px;font-weight:bold;
}
#copyBtn{background:#00b853;}
#downloadBtn{background:#ff5500;}
</style>
</head>
<body>

<textarea id="input" placeholder="粘贴你的 Lua 脚本"></textarea>

<button onclick="startObf()">生成混淆 </button>
<button onclick="copyCode()" id="copyBtn">一键复制结果</button>
<button onclick="downloadLua()" id="downloadBtn">下载 .lua 文件</button>

<textarea id="output" readonly placeholder="生成结果在这里"></textarea>

<script>
// 随机变量名
function randVar() {
    let ch = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let res = ch[Math.floor(Math.random()*52)];
    for(let i=0;i<14;i++) res += ch[Math.floor(Math.random()*ch.length)];
    return res;
}

// 专属随机乱码
function randSpecialJunk() {
    const pool = `LPHV7Spkh%nLO9hjWKD,PR+8a3=#U2o8KGr*Y?Nd/29<OU!g/tljq=fX$rkD/SGD`;
    let res = "";
    for(let i=0;i<3800;i++) res += pool[Math.floor(Math.random()*pool.length)];
    return res;
}

// 主混淆
function startObf() {
    const input = document.getElementById("input").value.trim();
    if(!input) return alert("请输入代码！");

    let numArray = [];
    for(let i=0;i<input.length;i++){
        numArray.push(input.charCodeAt(i));
        for(let j=0;j<180;j++) numArray.push(Math.floor(Math.random()*255));
    }

    const v1=randVar(),v2=randVar(),v3=randVar(),v4=randVar(),v5=randVar();
    const junkCode = randSpecialJunk();

    const finalCode = `-- This file was protected using HB Script Obfuscator v1
return (function()
local ${v1},${v2},${v3},${v4}=string.byte,string.sub,string.gsub,string.char
local ${v5}=loadstring or load
local safe=[=[${junkCode}]=]
local code_data={${numArray.join(",")}}
local result=""
for i=1,${input.length} do
    result=result..${v4}(code_data[i*181-180])
end
local ok,func=pcall(${v5},result)
if ok then func() end
end)()`;

    document.getElementById("output").value = finalCode;
}

// 复制
function copyCode() {
    const out = document.getElementById("output");
    if(!out.value) return alert("请先生成混淆代码！");
    out.select();
    document.execCommand("copy");
    alert("✅ 复制成功！");
}

// 下载（新增）
function downloadLua() {
    const txt = document.getElementById("output").value;
    if(!txt) return alert("先生成代码");
    const blob = new Blob([txt], {type:"text/lua"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.download = "protected.lua";
    a.href = url;
    a.click();
    URL.revokeObjectURL(url);
    alert("✅ 下载完成");
}
</script>
</body>
</html>
