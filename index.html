    let res = ch[Math.floor(Math.random()*52)];
    for(let i=0;i<14;i++) res += ch[Math.floor(Math.random()*ch.length)];

}

function copyCode() {
    const out = document.getElementById("output");
    if(!out.value) return alert("请先生成混淆代码！");
    out.select();
    document.execCommand("copy");
    alert("✅ 复制成功！");
}

// 一键下载 .lua 脚本（新增功能）
function downloadLua() {
    const content = document.getElementById("output").value;
    if(!content) return alert("请先生成混淆代码！");
    
    const blob = new Blob([content], { type: "text/lua" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    
    a.href = url;
    a.download = "protected_script.lua";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    alert("✅ 下载成功！文件：protected_script.lua");
}
</script>
