<body>
    <div class="container">

    <script>
        // 修复后的混淆工具核心
        class GodzillaObfuscator {
            constructor() {
                this.obfLevel = 'medium';
                this.stringEncrypt = 'base64';
                this.controlFlowLevel = 1;
                this.cache = new Map();
            }

            // 修复：生成有效的变量名
            generateRandomName(prefix = '_') {
                const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let name = prefix;
                for (let i = 0; i < 8; i++) {
                    name += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return name;
            }

            // 修复：正确的十六进制编码
            hexEncode(str) {
                let hex = '';
                for (let i = 0; i < str.length; i++) {
                    hex += '\\x' + str.charCodeAt(i).toString(16).padStart(2, '0');
                }
                return hex;
            }

            // 修复：正确的XOR加密
            xorEncode(str, key) {
                let result = '';
                for (let i = 0; i < str.length; i++) {
                    const charCode = str.charCodeAt(i) ^ key.charCodeAt(i % key.length);
                    result += String.fromCharCode(charCode);
                }
                return result;
            }

            // 修复：生成可执行的Lua代码
            encryptString(str, method) {
                const cacheKey = `${method}_${str}`;
                if (this.cache.has(cacheKey)) {
                    return this.cache.get(cacheKey);
                }
                
                let result;
                switch(method) {
                    case 'hex':
                        result = `"${this.hexEncode(str)}"`;
                        break;
                    
                    case 'base64':
                        // 修复：生成可执行的Base64解码代码
                        const base64 = btoa(unescape(encodeURIComponent(str)));
                        const decodeFunc = this.generateRandomName('decode');
                        result = `(function()
    local data = "${base64}"
    local b='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
    return (data:gsub('.', function(x)
        if (x == '=') then return '' end
        local r,f='',(b:find(x)-1)
        for i=6,1,-1 do r=r..(f%2^i-f%2^(i-1)>0 and '1' or '0') end
        return r;
    end):gsub('%d%d%d?%d?%d?%d?%d?%d?', function(x)
        if (#x ~= 8) then return '' end
        local c=0
        for i=1,8 do c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0) end
        return string.char(c)
    end))
end)()`;
                        break;
                    
                    case 'xor':
                        // 修复：生成可执行的XOR解密代码
                        const xorKey = this.generateRandomName('key').substring(0, 8);
                        const xorEncoded = this.xorEncode(str, xorKey);
                        const hexXor = this.hexEncode(xorEncoded);
                        result = `(function()
    local key = "${xorKey}"
    local data = "${hexXor}"
    local result = ""
    for i = 1, #data, 2 do
        local byte = tonumber(data:sub(i, i+1), 16)
        if byte then
            local keyIndex = ((i-1)/2) % #key + 1
            result = result .. string.char(byte ~ key:byte(keyIndex))
        end
    end
    return result
end)()`;
                        break;
                    
                    case 'double':
                        // 修复：双重加密
                        const base64Str = btoa(unescape(encodeURIComponent(str)));
                        const doubleKey = this.generateRandomName('dk').substring(0, 6);
                        const xorDouble = this.xorEncode(base64Str, doubleKey);
                        const hexDouble = this.hexEncode(xorDouble);
                        result = `(function()
    local key = "${doubleKey}"
    local data = "${hexDouble}"
    
    -- XOR 解密
    local xorResult = ""
    for i = 1, #data, 2 do
        local byte = tonumber(data:sub(i, i+1), 16)
        if byte then
            local keyIndex = ((i-1)/2) % #key + 1
            xorResult = xorResult .. string.char(byte ~ key:byte(keyIndex))
        end
    end
    
    -- Base64 解密
    local b='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
    return (xorResult:gsub('.', function(x)
        if (x == '=') then return '' end
        local r,f='',(b:find(x)-1)
        for i=6,1,-1 do r=r..(f%2^i-f%2^(i-1)>0 and '1' or '0') end
        return r;
    end):gsub('%d%d%d?%d?%d?%d?%d?%d?', function(x)
        if (#x ~= 8) then return '' end
        local c=0
        for i=1,8 do c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0) end
        return string.char(c)
    end))
end)()`;
                        break;
                    
                    default:
                        result = `"${str}"`;
                }
                
                this.cache.set(cacheKey, result);
                return result;
            }

            // 修复：提取URL的正则表达式
            extractUrls(code) {
                const urlRegex = /['"](https?:\/\/[^'"]+)['"]/g;
                const urls = [];
                let match;
                
                while ((match = urlRegex.exec(code)) !== null) {
                    urls.push({
                        original: match[0],
                        url: match[1],
                        index: match.index
                    });
                }
                return urls;
            }

            // 修复：生成有效的控制流混淆
            generateControlFlow(codeBlock, level) {
                if (level <= 0) return codeBlock;
                
                let result = '';
                const controlVar = this.generateRandomName('ctrl');
                const conditionValues = [];
                
                // 生成控制变量和随机条件
                for (let i = 0; i < level; i++) {
                    conditionValues.push(Math.floor(Math.random() * 1000));
                }
                
                // 设置控制变量
                const initValue = Math.floor(Math.random() * 1000);
                result += `local ${controlVar} = ${initValue}\n`;
                
                // 生成嵌套条件
                for (let i = 0; i < level; i++) {
                    const op = i % 2 === 0 ? '>' : '<';
                    const compareValue = Math.floor(Math.random() * 1000);
                    result += `if ${controlVar} ${op} ${compareValue} then\n`;
                    result += `    ${controlVar} = ${controlVar} + ${Math.floor(Math.random() * 100)}\n`;
                }
                
                // 添加主代码
                result += `    ${codeBlock.replace(/\n/g, '\n    ')}\n`;
                
                // 结束所有if语句
                result += 'end '.repeat(level);
                
                // 添加冗余代码
                for (let i = 0; i < level; i++) {
                    const junkVar = this.generateRandomName('junk');
                    const junkValue = Math.floor(Math.random() * 1000);
                    result += `\nlocal ${junkVar} = ${junkValue}`;
                }
                
                return result;
            }

            // 修复：生成有效的垃圾代码
            generateJunkCode(count) {
                const junk = [];
                const ops = ['+', '-', '*'];
                
                for (let i = 0; i < count; i++) {
                    const varName = this.generateRandomName('g');
                    const num1 = Math.floor(Math.random() * 100);
                    const num2 = Math.floor(Math.random() * 50) + 1;
                    const op = ops[Math.floor(Math.random() * ops.length)];
                    
                    if (Math.random() > 0.5) {
                        junk.push(`local ${varName} = ${num1} ${op} ${num2}`);
                    } else {
                        const strLength = Math.floor(Math.random() * 10) + 5;
                        const randomStr = Math.random().toString(36).substring(2, 2 + strLength);
                        junk.push(`local ${varName} = "${randomStr}"`);
                    }
                }
                
                return junk.join('\n');
            }

            // 修复：生成有效的反调试代码
            generateAntiDebug() {
                const debugVar = this.generateRandomName('debug');
                return `
--[[ 反调试检测 ]]--
local ${debugVar} = {}
local function ${this.generateRandomName('check')}()
    if type(debug) == 'table' and debug.getinfo then
        local info = debug.getinfo(1)
        if info then
            return false
        end
    end
    return true
end

if not ${debugVar}.${this.generateRandomName('func')} then
    ${debugVar}.${this.generateRandomName('func')} = function() return true end
end

if ${this.generateRandomName('check')}() then
    --[[ 正常执行 ]]--
                `.trim();
            }

            // 修复：核心混淆函数
            async obfuscate(code, progressCallback = null) {
                const startTime = performance.now();
                
                this.obfLevel = document.getElementById('obfLevel').value;
                this.stringEncrypt = document.getElementById('stringEncrypt').value;
                this.controlFlowLevel = parseInt(document.getElementById('controlFlow').value);
                
                // 提取并加密URL
                const urls = this.extractUrls(code);
                let obfuscated = code;
                
                // 从后往前替换，避免索引变化问题
                for (let i = urls.length - 1; i >= 0; i--) {
                    const url = urls[i];
                    const encryptedUrl = this.encryptString(url.url, this.stringEncrypt);
                    obfuscated = obfuscated.substring(0, url.index) + 
                                 encryptedUrl + 
                                 obfuscated.substring(url.index + url.original.length);
                    
                    if (progressCallback) {
                        progressCallback((urls.length - i) / urls.length * 50);
                    }
                }
                
                // 构建最终代码
                let finalCode = `--[ 哥斯拉 Pro Obfuscator v3.0 - ${new Date().toLocaleDateString()} ]--\n\n`;
                
                // 添加反调试
                if (this.obfLevel !== 'light') {
                    finalCode += this.generateAntiDebug() + '\n\n';
                }
                
                // 添加垃圾代码
                let junkCount = 0;
                switch(this.obfLevel) {
                    case 'light': junkCount = 5; break;
                    case 'medium': junkCount = 10; break;
                    case 'heavy': junkCount = 15; break;
                    case 'extreme': junkCount = 25; break;
                }
                finalCode += this.generateJunkCode(junkCount) + '\n\n';
                
                // 添加主代码（可选控制流混淆）
                if (this.controlFlowLevel > 0 && this.obfLevel !== 'light') {
                    finalCode += this.generateControlFlow(obfuscated, this.controlFlowLevel);
                } else {
                    finalCode += obfuscated;
                }
                
                // 添加结束标记
                if (this.obfLevel !== 'light') {
                    finalCode += `\n\n--[[ 混淆完成 ]]--`;
                }
                
                const endTime = performance.now();
                const timeTaken = (endTime - startTime).toFixed(2);
                
                return {
                    code: finalCode,
                    time: timeTaken,
                    length: finalCode.length,
                    originalLength: code.length
                };
            }
        }

        // UI相关函数保持不变...
        const obfuscator = new GodzillaObfuscator();
        let obfuscationHistory = [];

        function updateLevelValue() {
            const select = document.getElementById('obfLevel');
            const valueSpan = document.getElementById('levelValue');
            valueSpan.textContent = select.options[select.selectedIndex].text.split('（')[0];
        }

        function updateEncryptValue() {
            const select = document.getElementById('stringEncrypt');
            const valueSpan = document.getElementById('encryptValue');
            valueSpan.textContent = select.options[select.selectedIndex].text;
        }

        function updateFlowValue() {
            const slider = document.getElementById('controlFlow');
            const valueSpan = document.getElementById('flowValue');
            valueSpan.textContent = slider.value;
        }

        updateLevelValue();
        updateEncryptValue();
        updateFlowValue();

        function applyPreset(preset) {
            const presetButtons = document.querySelectorAll('.preset-btn');
            presetButtons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            switch(preset) {
                case 'default':
                    document.getElementById('obfLevel').value = 'medium';
                    document.getElementById('stringEncrypt').value = 'base64';
                    document.getElementById('controlFlow').value = 1;
                    break;
                case 'performance':
                    document.getElementById('obfLevel').value = 'light';
                    document.getElementById('stringEncrypt').value = 'hex';
                    document.getElementById('controlFlow').value = 0;
                    break;
                case 'security':
                    document.getElementById('obfLevel').value = 'heavy';
                    document.getElementById('stringEncrypt').value = 'double';
                    document.getElementById('controlFlow').value = 3;
                    break;
                case 'extreme':
                    document.getElementById('obfLevel').value = 'extreme';
                    document.getElementById('stringEncrypt').value = 'double';
                    document.getElementById('controlFlow').value = 5;
                    break;
            }
            
            updateLevelValue();
            updateEncryptValue();
            updateFlowValue();
            showNotification(`已应用 ${preset} 预设配置`);
        }

        function showNotification(message, duration = 3000) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, duration);
        }

        function updateCodeStats() {
            const originalCode = document.getElementById('originalCode').value;
            const obfCode = document.getElementById('obfCode').value;
            
            document.getElementById('charCount').textContent = `${originalCode.length} 字符`;
            document.getElementById('lineCount').textContent = `${originalCode.split('\n').length} 行`;
            
            document.getElementById('obfCharCount').textContent = `${obfCode.length} 字符`;
            document.getElementById('obfLineCount').textContent = `${obfCode.split('\n').length} 行`;
        }

        function addToHistory(result) {
            const historyItem = {
                timestamp: new Date().toLocaleString(),
                originalLength: result.originalLength,
                obfuscatedLength: result.length,
                time: result.time
            };
            
            obfuscationHistory.unshift(historyItem);
            if (obfuscationHistory.length > 10) {
                obfuscationHistory = obfuscationHistory.slice(0, 10);
            }
            
            updateHistoryDisplay();
            saveHistory();
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('historyList');
            const historyCount = document.getElementById('historyCount');
            
            historyList.innerHTML = '';
            historyCount.textContent = `(${obfuscationHistory.length})`;
            
            obfuscationHistory.forEach((item, index) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <span>${item.timestamp}</span>
                    <span>${item.originalLength} → ${item.obfuscatedLength} 字符</span>
                `;
                historyItem.onclick = () => {
                    document.getElementById('statsInfo').textContent = 
                        `历史记录 ${index+1}: ${item.timestamp} | 耗时 ${item.time}ms`;
                    document.getElementById('statsInfo').classList.add('active');
                };
                historyList.appendChild(historyItem);
            });
        }

        function saveHistory() {
            localStorage.setItem('godzillaHistory', JSON.stringify(obfuscationHistory));
        }

        function loadHistory() {
            const savedHistory = localStorage.getItem('godzillaHistory');
            if (savedHistory) {
                obfuscationHistory = JSON.parse(savedHistory);
                updateHistoryDisplay();
            }
        }

        async function obfuscateLua() {
            let code = document.getElementById("originalCode").value.trim();
            if (!code) {
                showNotification("请粘贴需要混淆的Lua脚本！", 3000);
                return;
            }

            try {
                const statsDiv = document.getElementById("statsInfo");
                const obfuscateBtn = document.getElementById("obfuscateBtn");
                const progressContainer = document.getElementById("progressContainer");
                const progressBar = document.getElementById("progressBar");
                
                statsDiv.textContent = "正在混淆中...";
                statsDiv.classList.remove('active');
                obfuscateBtn.disabled = true;
                obfuscateBtn.textContent = "混淆中...";
                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                
                const progressCallback = (progress) => {
                    progressBar.style.width = `${progress}%`;
                };
                
                const result = await obfuscator.obfuscate(code, progressCallback);
                
                document.getElementById("obfCode").value = result.code;
                progressBar.style.width = '100%';
                
                statsDiv.textContent = 
                    `✅ 混淆完成！耗时 ${result.time}ms | ` +
                    `原始长度：${result.originalLength} 字符 | ` +
                    `混淆后：${result.length} 字符 | ` +
                    `压缩率：${((1 - result.originalLength / result.length) * 100).toFixed(1)}%`;
                statsDiv.classList.add('active');
                
                addToHistory(result);
                updateCodeStats();
                
                setTimeout(() => {
                    obfuscateBtn.disabled = false;
                    obfuscateBtn.innerHTML = '<span>🦖🦖🦖</span> 一键混淆';
                    progressContainer.style.display = 'none';
                    document.getElementById("obfCode").scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 500);
                
            } catch (error) {
                console.error("混淆错误:", error);
                showNotification(`混淆失败：${error.message}`, 5000);
                document.getElementById("statsInfo").textContent = "❌❌ 混淆失败，请检查输入";
                document.getElementById("statsInfo").classList.remove('active');
                
                document.getElementById("obfuscateBtn").disabled = false;
                document.getElementById("obfuscateBtn").innerHTML = '<span>🦖🦖🦖</span> 一键混淆';
                document.getElementById("progressContainer").style.display = 'none';
            }
        }

        function clearAll() {
            if (confirm("确定要清空所有内容吗？")) {
                document.getElementById("originalCode").value = "";
                document.getElementById("obfCode").value = "";
                document.getElementById("statsInfo").textContent = "等待混淆...";
                document.getElementById("statsInfo").classList.remove('active');
                document.getElementById("originalCode").focus();
                updateCodeStats();
            }
        }

        function copyObfCode() {
            const obfCode = document.getElementById("obfCode");
            if (!obfCode.value.trim()) {
                showNotification("暂无混淆后的代码可复制！", 3000);
                return;
            }
            
            obfCode.select();
            obfCode.setSelectionRange(0, 99999);
            
            try {
                const successful = document.execCommand("copy");
                if (successful) {
                    showNotification("✅ 代码已复制到剪贴板！", 2000);
                } else {
                    showNotification("复制失败，请手动选择并复制", 3000);
                }
            } catch (err) {
                console.error("复制失败:", err);
                showNotification("复制失败，请手动复制", 3000);
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                obfuscateLua();
                e.preventDefault();
            }
            if (e.ctrlKey && e.key === 'c') {
                if (document.activeElement === document.getElementById("obfCode")) {
                    copyObfCode();
                    e.preventDefault();
                }
            }
            if (e.key === 'Escape') {
                clearAll();
            }
        });

        document.getElementById('originalCode').addEventListener('input', updateCodeStats);
        document.getElementById('obfCode').addEventListener('input', updateCodeStats);

        window.addEventListener('load', function() {
            const exampleCode = `loadstring(game:HttpGet("https://example.com/script.lua"))()`;
            document.getElementById("originalCode").placeholder = exampleCode;
            updateCodeStats();
            loadHistory();
            
            // 添加测试按钮
            const testBtn = document.createElement('button');
            testBtn.className = 'btn';
            testBtn.style.background = 'linear-gradient(135deg, #0066ff, #00ccff)';
            testBtn.style.marginLeft = '10px';
            testBtn.innerHTML = '<span>🧪</span> 测试混淆';
            testBtn.onclick = async function() {
                const testCode = `print("Hello World!")
local url = "https://raw.githubusercontent.com/test/script.lua"
loadstring(game:HttpGet(url))()
function test()
    print("Function test")
end`;
                document.getElementById("originalCode").value = testCode;
                await obfuscateLua();
            };
            document.querySelector('.btn-group').appendChild(testBtn);
        });
    </script>
</body>
    </html>
